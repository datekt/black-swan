<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Swan</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 27, 34, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            backdrop-filter: blur(10px);
            z-index: 10;
            min-width: 260px;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; letter-spacing: 1px; }
        .subtitle { color: #8b949e; font-size: 0.85rem; }
        hr { border-color: #30363d; margin: 15px 0; }
        .row { margin: 8px 0; font-size: 0.9rem; }
        .row label { display: inline-block; width: 70px; color: #8b949e; }
        input[type="range"] { width: 150px; vertical-align: middle; }
        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            margin-right: 6px;
        }
        button:hover { background: #30363d; }
        #eventBanner {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(138, 43, 226, 0.85);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }
        #eventBanner.visible { opacity: 1; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="controls">
        <h1>🦅 BLACK SWAN EVENT</h1>
        <div class="subtitle">Deterministic Orbit Simulator</div>
        <hr>
        <div class="row">Status: <span id="status" style="color: #d29922;">Awaiting telemetry...</span></div>
        <div class="row"><label>Speed</label><input id="speed" type="range" min="0" max="8" step="0.25" value="1"><span id="speedLabel" style="margin-left: 8px; color: #c9d1d9;">×1.0</span></div>
        <div class="row">
            <button id="togglePlay">Pause</button>
            <button id="restart">Restart</button>
        </div>
        <hr>
        <div class="row" id="frameInfo" style="color: #8b949e; font-size: 0.8rem;">Frame: – / –</div>
        <div class="row" id="simTime" style="color: #8b949e; font-size: 0.8rem;">Sim time: –</div>
    </div>
    <div id="eventBanner"></div>
    <canvas id="orbitCanvas"></canvas>
    <script src="app.js"></script>
</body>
</html>
